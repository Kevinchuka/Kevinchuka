name: Generate Snake Animation

on:
  schedule:
    # Se ejecuta cada 12 horas
    - cron: "0 */12 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # También al hacer push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff6a00&color_dots=%230d0d0f,%235c2a00,%23994400,%23cc5c00,%23ff6a00
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff6a00&color_dots=%230d0d0f,%235c2a00,%23994400,%23cc5c00,%23ff6a00

      - name: Push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
